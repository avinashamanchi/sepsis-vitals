[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsis-vitals"
version = "0.7.0"
description = "Investigational sepsis early-warning research and validation platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.0",
    "numpy>=1.25",
]

# Installation sets (reproducible pins: requirements/*.txt, see docs/dependencies.md)
#   API container:   [api,ml]   -> requirements/deploy.txt
#   CI and dev:      [api,ml,train,copilot,integrations,dev] -> requirements/dev.txt
[project.optional-dependencies]
# HTTP API, authentication and database.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "email-validator>=2.0",
    "cryptography>=42.0",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "pyotp>=2.9",
    "sqlalchemy>=2.0",
    # Synchronous Postgres driver used by SQLAlchemy and Alembic
    # (URLs are normalised to postgresql+psycopg:// in sepsis_vitals.db).
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    # Token revocation and rate limits shared across workers when REDIS_URL is set.
    "redis>=5.0",
    "websockets>=12.0",
]
# Model inference. The trainer may select a LightGBM or XGBoost model, so
# their runtimes are needed wherever such an artifact is served.
ml = [
    # joblib model artifacts were serialized with 1.6.1; sklearn does not
    # guarantee cross-version model compatibility.
    "scikit-learn==1.6.1",
    "joblib>=1.3",
    "lightgbm>=4.0",
    "xgboost>=2.0",
]
# Training and explanation reports (retrain.py, sepsis_vitals.ml.trainer); with [ml].
train = [
    "shap>=0.42",
]
# Frozen features: install only where they are explicitly enabled.
copilot = [
    "anthropic>=0.25",
]
integrations = [
    "stripe>=8.0",
    "twilio>=9.0",
    "africastalking>=1.2",
    "pywebpush>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "bandit[toml]>=1.7",
    "pandas-stubs",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sepsis_vitals.i18n" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4","E7","E9","F"]
ignore  = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Reuses the client/clock fixtures from tests/test_mfa.py by importing them;
# pytest injects them by parameter name, which ruff reads as a redefinition.
"tests/test_mfa_replay.py" = ["F811"]

[tool.bandit]
exclude_dirs = ["tests","examples"]
skips = ["B101"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
