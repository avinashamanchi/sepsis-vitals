name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy src/sepsis_vitals --ignore-missing-imports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit[toml]
      - run: bandit -r src/ -c pyproject.toml -ll

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,api,ml]"
      - run: pytest --tb=short -q --durations=15
        if: matrix.python-version != '3.11'
      - run: pytest --cov=sepsis_vitals --cov-report=term-missing --tb=short -q --durations=15
        if: matrix.python-version == '3.11'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  postgres-migrations:
    # Alembic upgrade/downgrade, blind-index backfill and an application smoke
    # test against real PostgreSQL (SQLite cannot run the Postgres-only DDL).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sepsis
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: sepsis_vitals
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sepsis -d sepsis_vitals"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://sepsis:ci-only-not-a-secret@localhost:5432/sepsis_vitals
      SEPSIS_JWT_SECRET: ci-only-jwt-secret-not-used-outside-ci-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[api]"
      - name: Bootstrap extensions (as the compose Postgres container does)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/postgres/init.sql
      - name: Migrations and application smoke test
        run: |
          export SEPSIS_PII_KEY="$(python -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')"
          python scripts/ci_postgres_smoke.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -f docker/Dockerfile -t sepsis-vitals-api:ci .
      - name: API image has the app, ML stack, Postgres driver and Alembic
        run: >-
          docker run --rm -e SEPSIS_ENV=development --entrypoint python sepsis-vitals-api:ci
          -c "import sepsis_vitals.api, sklearn, psycopg, alembic; print('imports ok')"
      - name: Build dashboard image
        run: docker build -f docker/Dockerfile.frontend -t sepsis-vitals-web:ci .
